[package]
name = "notification-daemon"
version = "0.2.1"
edition = "2024"

[dependencies]
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop", "xkbcommon"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
resvg = { version = "0.50", default-features = false }
cosmic-text = { version = "0.19", default-features = false, features = ["std", "fontconfig", "swash"] }
zune-jpeg = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
